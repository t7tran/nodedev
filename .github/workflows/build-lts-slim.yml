name: Build LTS Slim

on:
  push:
    branches:
      - master
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      node-version: lts
      variant: slim
      tag: lts-slim
      cache-scope: lts-slim
